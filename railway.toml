[build]
builder = "nixpacks"
buildCommand = "bun run build"

[deploy]
startCommand = "CINE_REACT_DATA_DIR=/data CINECLIPS_UPLOAD_DIR=/data/cineclips-uploads node dist/server.cjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Volume persistente para DB CineClips, uploads e exports.
[[deploy.mounts]]
volumeName = "cinereact-data"
mountPath = "/data"
