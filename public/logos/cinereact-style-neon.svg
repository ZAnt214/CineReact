<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="1280" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
    </style>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="120" rx="16" fill="#050506"/>
  <text x="320" y="54" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="40" letter-spacing="0.05em" filter="url(#glow)">
    <tspan fill="#fafafa" font-weight="600">CINE</tspan><tspan fill="#66ffff" font-weight="700">REACT</tspan>
  </text>
  <text x="320" y="86" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#00d4ff" fill-opacity="0.75" letter-spacing="0.08em">Sua plataforma de reacts</text>
</svg>
