<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="200" height="200" rx="44" fill="#09090B"/>

  <!-- Logo Emblem Badge -->
  <g transform="translate(25, 25)">
    <!-- Outer Glow Ring -->
    <rect x="0" y="0" width="150" height="150" rx="36" fill="url(#goldGrad)" filter="url(#glow)" opacity="0.6" />
    <rect x="4" y="4" width="142" height="142" rx="32" fill="url(#badgeBg)" stroke="url(#goldGrad)" stroke-width="4" />
    
    <!-- Film Reel & Play Overlay -->
    <g transform="translate(38, 38)">
      <path d="M10 16 C10 10, 16 6, 24 6 L52 6 C60 6, 66 10, 66 16 L66 60 C66 66, 60 70, 52 70 L24 70 C16 70, 10 66, 10 60 Z" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="10" y1="26" x2="66" y2="26" stroke="url(#goldGrad)" stroke-width="4"/>
      <line x1="24" y1="6" x2="30" y2="26" stroke="url(#goldGrad)" stroke-width="4"/>
      <line x1="44" y1="6" x2="50" y2="26" stroke="url(#goldGrad)" stroke-width="4"/>
      <!-- Glowing Play Arrow inside -->
      <polygon points="32,38 52,48 32,58" fill="#FBBF24" />
    </g>
  </g>
</svg>
