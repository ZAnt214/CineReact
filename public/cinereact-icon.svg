<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="badgeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#78716c" stop-opacity="0.25" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="200" height="200" rx="44" fill="#141210"/>

  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="150" height="150" rx="36" fill="url(#badgeBg)" filter="url(#glow)" opacity="0.9" />
    <rect x="4" y="4" width="142" height="142" rx="32" fill="url(#badgeBg)" stroke="url(#badgeRing)" stroke-width="2" />

    <g transform="translate(38, 38)">
      <rect x="10" y="16" width="56" height="44" rx="4" fill="none" stroke="#e7e5e4" stroke-width="4" stroke-linejoin="round"/>
      <line x1="10" y1="26" x2="66" y2="26" stroke="#a8a29e" stroke-width="3" stroke-linecap="round"/>
      <polygon points="32,38 52,48 32,58" fill="#fafaf9" />
    </g>
  </g>
</svg>
