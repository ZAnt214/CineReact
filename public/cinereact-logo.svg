<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="1040" height="260">
  <defs>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4ff" />
      <stop offset="40%" stop-color="#7b8cff" />
      <stop offset="75%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b6be0" />
      <stop offset="50%" stop-color="#7b8cff" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="520" height="130" rx="16" fill="#080a14"/>

  <!-- perforations -->
  <g opacity="0.55">
    <rect x="28" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="42" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="56" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="70" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="84" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="98" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="112" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="126" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="140" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="154" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
    <rect x="168" y="18" width="7" height="7" rx="1" fill="#a5b4ff"/>
  </g>

  <line x1="28" y1="48" x2="120" y2="48" stroke="url(#reactGrad)" stroke-opacity="0.4" stroke-width="1"/>
  <text x="128" y="50" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#c084fc">✦</text>
  <text x="148" y="50" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#d4d0f0" letter-spacing="8">CINE</text>
  <text x="292" y="50" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#c084fc">✦</text>
  <line x1="312" y1="48" x2="400" y2="48" stroke="url(#reactGrad)" stroke-opacity="0.4" stroke-width="1"/>

  <text x="28" y="102" font-family="Arial, sans-serif" font-weight="900" font-size="56" fill="url(#reactGrad)" filter="url(#glow)" letter-spacing="-2">REACT</text>
  <rect x="28" y="112" width="340" height="3" rx="1.5" fill="url(#railGrad)" opacity="0.85"/>
</svg>
