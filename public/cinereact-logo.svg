<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="1000" height="240">
  <defs>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1" />
      <stop offset="50%" stop-color="#e7e5e4" />
      <stop offset="100%" stop-color="#a8a29e" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="badgeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#78716c" stop-opacity="0.25" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="120" rx="16" fill="#141210"/>

  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#badgeBg)" filter="url(#glow)" opacity="0.9" />
    <rect x="2" y="2" width="76" height="76" rx="18" fill="url(#badgeBg)" stroke="url(#badgeRing)" stroke-width="1.5" />

    <g transform="translate(20, 20)">
      <rect x="5" y="8" width="30" height="24" rx="3" fill="none" stroke="#e7e5e4" stroke-width="2" stroke-linejoin="round"/>
      <line x1="5" y1="13" x2="35" y2="13" stroke="#a8a29e" stroke-width="1.5" stroke-linecap="round"/>
      <polygon points="17,19 27,25 17,31" fill="#fafaf9" />
    </g>
  </g>

  <text x="120" y="70" font-family="'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="42" fill="#fafaf9" letter-spacing="-0.5">
    Cine<tspan fill="url(#wordGrad)">React</tspan>
  </text>
</svg>
