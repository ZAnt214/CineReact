<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260">
  <defs>
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="icon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="180" cy="78" r="52" fill="#00E5FF" fill-opacity="0.2" filter="url(#icon-glow)"/>

  <rect x="138" y="36" width="84" height="84" rx="22" fill="#00E5FF"/>
  <polygon points="162,58 162,98 198,78" fill="#0a0a0a"/>

  <text x="180" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#text-shadow)">
    <tspan fill="#ffffff">Cine</tspan><tspan fill="#00E5FF">React</tspan>
  </text>

  <text x="180" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#00E5FF" filter="url(#text-shadow)">assista mais reacts aqui</text>

  <rect x="78" y="206" width="204" height="42" rx="21" fill="#00E5FF"/>
  <text x="180" y="233" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#000000">bit.ly/CineReact</text>
</svg>
